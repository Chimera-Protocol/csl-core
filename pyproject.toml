[build-system]

requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csl-core"
dynamic = ["version"]
description = "CSL-Core: Deterministic Safety Layer for Probabilistic AI Systems"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["ai-safety", "formal-verification", "langchain", "policy-engine", "z3"]

authors = [
    {name = "Aytug Akarlar", email = "akarlaraytu@gmail.com"},
]
maintainers = [
    {name = "Chimera Team", email = "akarlaraytu@gmail.com"},
]

# BAĞIMLILIKLAR
dependencies = [
    "z3-solver>=4.12.0",
    "rich>=13.0.0",
    "textual>=1.0.0",  # cslcore studio: the CSL editor (0.6)
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.1.0",
    "pydantic>=2.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.16,<0.17",
    "black",
    "mypy",
    "langchain-core>=0.1.0",
    "pydantic>=2.0.0",
    "mcp[cli]>=1.2.0,<2.0.0",
]

mcp = ["mcp[cli]>=1.2.0,<2.0.0"]
venom = ["psutil>=5.9"]

# LİNKLERİNİ GÜNCELLE
[project.urls]
Homepage = "https://github.com/Chimera-Protocol/csl-core"
Documentation = "https://github.com/Chimera-Protocol/csl-core/tree/main/docs"
Repository = "https://github.com/Chimera-Protocol/csl-core"
Issues = "https://github.com/Chimera-Protocol/csl-core/issues"

[project.scripts]
cslcore = "chimera_core.cli:main"
csl-core = "chimera_core.cli:main"  # the same CLI under the package name: `uvx csl-core venom` works without installing
csl-core-mcp = "chimera_core.mcp.server:main"

# --- SETUPTOOLS CONFIGURATION ---

[tool.setuptools.dynamic]
version = {attr = "chimera_core.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["chimera_core*"]
exclude = ["tests*", "docs*", "examples*", "quickstart*", "benchmarks*"]

[tool.setuptools.package-data]
"*" = ["*.csl", "*.json", "*.md"]

# --- DEV TOOLS ---

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
# frozen since v0.5.1 (byte-identical, checked by the contract suite) and test fixtures that are broken on purpose
extend-exclude = [
    "chimera_core/runtime.py",
    "chimera_core/language",
    "chimera_core/engines",
    "chimera_core/factory.py",
    "tests/venom/fixtures",
]

[tool.ruff.lint]
# pinned so a newer ruff does not change what CI checks: syntax errors, undefined names, unused
# imports and variables, and the other pyflakes / pycodestyle error checks
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]  # short names such as `l` in small loops are a style choice, not an error

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=chimera_core --cov-report=term-missing"