name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: 0.5.1 contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Contract suite (goldens from v0.5.1)
        run: pytest tests/contract --no-cov

      - name: Unmodified v0.5.1 test suite against current code
        run: |
          mkdir -p "$RUNNER_TEMP/v051"
          git archive v0.5.1 | tar -x -C "$RUNNER_TEMP/v051"
          rm -rf "$RUNNER_TEMP/v051/chimera_core"
          cd "$RUNNER_TEMP/v051" && python -m pytest tests --no-cov -q

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: [contract]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite with coverage
        run: pytest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Informational only for now: the existing codebase predates this workflow
    # and has a large backlog of style findings. Tracked as follow-up cleanup
    # debt rather than blocking merges on unrelated pre-existing files.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Black --check
        run: black --check .

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: pip install twine && twine check dist/*
